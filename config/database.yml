# PostgreSQL
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "dlm_development") %>
  username: <%= ENV.fetch("POSTGRES_USER", "dlm") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "dlm") %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>

test:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_TEST_DB", "dlm_test") %>
  username: <%= ENV.fetch("POSTGRES_USER", "dlm") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "dlm") %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
  database: <%= ENV.fetch("POSTGRES_DB", "dlm_production") %>
  username: <%= ENV["POSTGRES_USER"] %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>
  host: <%= ENV["POSTGRES_HOST"] %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>

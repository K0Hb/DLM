ru:
  number:
    currency:
      format:
        format: "%n %u"
        unit: "₽"
        separator: ","
        delimiter: " "
        precision: 2
        significant: false
        strip_insignificant_zeros: false
  date:
    formats:
      default: "%d.%m.%Y"
      long: "%d %B %Y"
      short: "%d %b"
  time:
    formats:
      default: "%d.%m.%Y %H:%M"
      long: "%d %B %Y, %H:%M"
      short: "%d.%m %H:%M"
    am: ""
    pm: ""
